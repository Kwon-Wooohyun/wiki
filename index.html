<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아이돌 팬덤 용어 위키</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style id="wiki-style">
/* Layout: wiki shell — ink header band + numbered 대분류 rail on top; 문서 구조/목차 sidebar on the left; ~760px reading column with a Notion-style block gutter */
:root {
  --bg: #FFFFFF;
  --bg-2: #F4F5FA;
  --band: #1C2052;
  --band-2: #2A2F6B;
  --band-ink: #F2F3FF;
  --band-ink-2: #AEB3E6;
  --band-alert: #FFA3AA;
  --ink: #191A2C;
  --ink-2: #4E5170;
  --ink-3: #8A8DA8;
  --rule: #E2E4EF;
  --accent: #2F45E0;
  --accent-ink: #FFFFFF;
  --accent-soft: #EBEEFF;
  --mark: #FFE98A;
  --danger: #CC3340;
  --code-bg: #F1F2F8;
  --pop-bg: #FFFFFF;
  --fmt-bg: #1B1D33;
  --fmt-ink: #F4F5FF;
  --fmt-hi: rgba(255, 255, 255, 0.16);
  --shadow: rgba(22, 25, 60, 0.18);
  --f-display: "Hahmlet", "Noto Serif KR", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gut: 56px;
  --head-h: 104px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121324; --bg-2: #191B30; --band: #0B0C1A; --band-2: #1E2142; --band-ink: #ECEDFB; --band-ink-2: #8E93C4;
    --ink: #E7E8F4; --ink-2: #AEB1CA; --ink-3: #777A96; --rule: #2A2D47; --accent: #95A2FF; --accent-ink: #0E1030;
    --accent-soft: #252A4E; --mark: #5E5114; --danger: #FF7D86; --code-bg: #1C1F37; --pop-bg: #1B1D33;
    --fmt-bg: #2C2F4D; --fmt-ink: #F0F1FF; --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121324; --bg-2: #191B30; --band: #0B0C1A; --band-2: #1E2142; --band-ink: #ECEDFB; --band-ink-2: #8E93C4;
  --ink: #E7E8F4; --ink-2: #AEB1CA; --ink-3: #777A96; --rule: #2A2D47; --accent: #95A2FF; --accent-ink: #0E1030;
  --accent-soft: #252A4E; --mark: #5E5114; --danger: #FF7D86; --code-bg: #1C1F37; --pop-bg: #1B1D33;
  --fmt-bg: #2C2F4D; --fmt-ink: #F0F1FF; --shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .35; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[contenteditable]:focus-visible, [contenteditable]:focus { outline: none; }
.muted { color: var(--ink-3); }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; }
.band { background: var(--band); color: var(--band-ink); }
.band-inner, .catnav-inner, .wrap {
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band-inner { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; color: var(--band-ink); text-decoration: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-tag { font-family: var(--f-mono); font-size: 11.5px; color: var(--band-ink-2); white-space: nowrap; }
.search { position: relative; margin-left: auto; flex: 0 1 340px; min-width: 0; }
.search input { width: 100%; height: 36px; border: 1px solid transparent; border-radius: 8px; background: var(--band-2); color: var(--band-ink); padding: 0 12px 0 34px; font: inherit; font-size: 14px; }
.search input::placeholder { color: var(--band-ink-2); }
.search input:focus { outline: none; border-color: var(--band-ink-2); }
.search input::-webkit-search-cancel-button { filter: grayscale(1); }
.search-ic { position: absolute; left: 12px; top: 11px; width: 12px; height: 12px; border: 1.6px solid var(--band-ink-2); border-radius: 50%; pointer-events: none; }
.search-ic::after { content: ""; position: absolute; width: 6px; height: 1.6px; background: var(--band-ink-2); right: -5px; bottom: -3px; transform: rotate(45deg); }
.help-btn { border: 1px solid var(--band-2); background: none; color: var(--band-ink-2); border-radius: 8px; height: 36px; padding: 0 12px; font-size: 13px; white-space: nowrap; }
.help-btn:hover { color: var(--band-ink); border-color: var(--band-ink-2); }
body.ro #helpBtn { display: none; }
.mode-sw { display: flex; flex: none; padding: 3px; gap: 2px; border-radius: 9px; background: var(--band-2); }
.mode-sw button { height: 30px; padding: 0 14px; border: 0; border-radius: 6px; background: none; color: var(--band-ink-2); font-size: 13px; font-weight: 500; white-space: nowrap; }
.mode-sw button:hover { color: var(--band-ink); }
.mode-sw button[aria-pressed="true"] { background: var(--band-ink); color: var(--band); font-weight: 600; }
.help-link { margin-top: 12px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-2); border-radius: 6px; padding: 5px 10px; font-size: 13px; }
.help-link:hover { color: var(--ink); border-color: var(--ink-3); }
.sync { display: flex; align-items: center; gap: 6px; min-width: 7.5em; font-family: var(--f-mono); font-size: 11.5px; color: var(--band-ink-2); white-space: nowrap; }
.sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sync[data-s="saving"]::before { animation: blink 1s ease-in-out infinite; }
.sync[data-s="error"] { color: var(--band-alert); }
@keyframes blink { 50% { opacity: .2; } }

.catnav { background: var(--bg); border-bottom: 1px solid var(--rule); }
.catnav-inner { display: flex; align-items: stretch; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.catnav-inner::-webkit-scrollbar { display: none; }
.cat-tab { display: flex; align-items: baseline; gap: 7px; padding: 12px 10px 10px; border-bottom: 2px solid transparent; color: var(--ink-2); text-decoration: none; white-space: nowrap; font-size: 14.5px; font-weight: 500; }
.cat-tab:hover { color: var(--ink); }
.cat-tab .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.cat-tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.cat-tab.on .n { color: var(--accent); }
.cat-add { align-self: center; margin-left: 8px; flex: none; border: 1px dashed var(--rule); background: none; color: var(--ink-3); border-radius: 6px; padding: 3px 10px; font-size: 13px; white-space: nowrap; }
.cat-add:hover { color: var(--accent); border-color: var(--accent); }
.cat-none { align-self: center; padding: 12px 0; font-size: 13.5px; color: var(--ink-3); }

/* ---------- shared ---------- */
.wrap { padding-block: 28px 96px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; color: var(--accent); letter-spacing: .06em; margin: 0 0 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; text-decoration: none; }
.btn.ghost { background: var(--bg); color: var(--ink-2); border-color: var(--rule); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--accent-ink); }
.text-btn { border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 500; padding: 4px 8px; border-radius: 6px; }
.text-btn:hover { background: var(--accent-soft); }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-2); border-radius: 6px; font-size: 13px; }
.icon-btn:hover { background: var(--bg-2); color: var(--ink); }
.mini-btn { border: 1px solid var(--rule); background: var(--bg); color: var(--ink-2); border-radius: 6px; font-size: 12.5px; padding: 2px 8px; }
.mini-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.state { display: flex; align-items: center; gap: 10px; color: var(--ink-3); padding: 48px 0; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--rule); border-top-color: var(--accent); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }
kbd { font-family: var(--f-mono); font-size: 11.5px; padding: 1px 6px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; background: var(--bg); color: var(--ink); white-space: nowrap; }

/* ---------- home (대문) ---------- */
.home { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 64px; }
.home-main { min-width: 0; }
.home-hero { padding: 16px 0 28px; border-bottom: 1px solid var(--rule); }
.home-title { font-family: var(--f-display); font-size: clamp(32px, 5vw, 52px); font-weight: 800; line-height: 1.15; letter-spacing: -0.015em; margin: 0 0 14px; position: relative; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }
.home .editor { max-width: 680px; min-height: 0; padding-bottom: 4px; }
.sec-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin: 32px 0 14px; }
.sec-head h2 { font-size: 17px; font-weight: 700; margin: 0; }
.sec-note { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.cat-card { display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 16px; border: 1px solid var(--rule); border-radius: 12px; color: var(--ink); text-decoration: none; background: var(--bg); transition: border-color .15s, background-color .15s; min-width: 0; }
.cat-card:hover { border-color: var(--accent); }
.cat-card-num { font-family: var(--f-display); font-size: 34px; font-weight: 800; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.cat-card-title { font-family: var(--f-display); font-size: 19px; font-weight: 700; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
.cat-card-subs { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.cat-card-subs li { display: flex; gap: 8px; font-size: 13.5px; color: var(--ink-2); min-width: 0; }
.cat-card-subs .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); padding-top: 1px; flex: none; }
.cat-card-subs .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-card-foot { margin-top: auto; padding-top: 4px; font-size: 12.5px; color: var(--ink-3); }
.empty { grid-column: 1 / -1; display: grid; gap: 12px; justify-items: start; padding: 28px; border: 1px dashed var(--rule); border-radius: 12px; color: var(--ink-2); }
.empty p { margin: 0; }
.home-side { padding-top: 16px; min-width: 0; }
.home-side h2 { font-size: 14px; font-weight: 700; margin: 0; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.recent { list-style: none; margin: 0; padding: 0; }
.recent li { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--rule); font-size: 14px; min-width: 0; }
.recent a { flex: 1; min-width: 0; display: flex; gap: 8px; color: var(--ink); text-decoration: none; }
.recent a:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.recent .n { font-family: var(--f-mono); font-size: 12px; color: var(--accent); flex: none; padding-top: 1px; }
.recent .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent time { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); flex: none; }
.recent li.muted { border: 0; color: var(--ink-3); }

/* ---------- document page ---------- */
.page { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 76px; }
.side { min-width: 0; }
.side-toggle { display: none; }
.side-inner { position: sticky; top: calc(var(--head-h) + 24px); max-height: calc(100vh - var(--head-h) - 48px); overflow: auto; display: grid; gap: 28px; align-content: start; padding: 2px 4px 12px 2px; }
.side-h { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .04em; margin: 0 0 8px; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { padding-left: 12px; margin-left: 8px; border-left: 1px solid var(--rule); }
.tree-row { display: flex; align-items: flex-start; border-radius: 6px; }
.tree-row:hover { background: var(--bg-2); }
.tree-row.on { background: var(--accent-soft); }
.tree-tg, .tree-sp { width: 18px; height: 30px; flex: none; }
.tree-tg { border: 0; background: none; padding: 0; color: var(--ink-3); display: grid; place-items: center; }
.tree-tg::before { content: ""; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 5px solid currentColor; transform: rotate(90deg); transition: transform .12s; }
.tree-tg.closed::before { transform: none; }
.tree-row a { flex: 1; min-width: 0; display: flex; gap: 7px; padding: 5px 4px; color: var(--ink-2); text-decoration: none; font-size: 14px; line-height: 1.45; }
.tree-row.on a { color: var(--ink); font-weight: 600; }
.tree-row a .n { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); padding-top: 2px; flex: none; }
.tree-row.on a .n { color: var(--accent); }
.tree-row a .t { overflow-wrap: anywhere; word-break: keep-all; }
.tree-add { width: 24px; height: 28px; flex: none; border: 0; background: none; color: var(--ink-3); border-radius: 4px; opacity: 0; font-size: 16px; }
.tree-row:hover .tree-add, .tree-add:focus-visible { opacity: 1; }
.tree-add:hover { color: var(--accent); }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.toc li[data-l="2"] { padding-left: 14px; }
.toc li[data-l="3"] { padding-left: 28px; }
.toc-a { display: flex; gap: 7px; width: 100%; padding: 4px 6px; border: 0; border-radius: 6px; background: none; text-align: left; font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
.toc-a:hover { background: var(--bg-2); color: var(--ink); }
.toc-a .n { font-family: var(--f-mono); font-size: 11.5px; color: var(--accent); padding-top: 2px; flex: none; }
.toc-a .t { overflow-wrap: anywhere; }
.toc-empty { font-size: 13px; color: var(--ink-3); padding: 2px 6px; }

.doc { min-width: 0; max-width: 760px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; color: var(--ink-3); }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; text-underline-offset: 3px; }
.doc-kind { display: flex; gap: 8px; margin-top: 22px; font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .02em; }
.doc-kind .lv { color: var(--ink-3); }
.doc-kind .num, .doc-kind .n { color: var(--accent); }
.doc .editor { margin-top: 22px; }
.doc-title { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.25; letter-spacing: -0.01em; margin: 6px 0 12px; position: relative; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }
.doc-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; font-size: 13px; color: var(--ink-3); padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
.doc-meta .spacer { flex: 1; }
.children { margin: 22px 0 28px; padding: 12px 16px 8px; background: var(--bg-2); border-radius: 10px; }
.ch-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ch-title { font-size: 14px; font-weight: 700; margin: 0; }
.ch-count { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.ch-head .text-btn { margin-left: auto; }
.ch-list { list-style: none; margin: 0; padding: 0; }
.ch-list li { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--rule); }
.ch-list li:first-child { border-top: 0; }
.ch-list a { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; padding: 9px 2px; color: var(--ink); text-decoration: none; font-size: 15px; }
.ch-list a:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.ch-list .pg { margin: 0 2px; }
.cat-card-subs li::before { content: "–"; color: var(--ink-3); flex: none; }
.img-busy { cursor: default; }
.img-busy:hover { border-color: var(--rule); color: var(--ink-2); }
.ch-list .t { overflow-wrap: anywhere; word-break: keep-all; }
.ch-list .sub { margin-left: auto; font-size: 12px; color: var(--ink-3); flex: none; }
.ch-ord { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.ch-list li:hover .ch-ord, .ch-ord:focus-within { opacity: 1; }
.mini-ic { width: 24px; height: 24px; border: 1px solid var(--rule); border-radius: 5px; background: var(--bg); color: var(--ink-2); font-size: 12px; padding: 0; }
.ch-empty { margin: 2px 0 8px; font-size: 13.5px; color: var(--ink-3); }
.missing { padding: 40px 0; display: grid; gap: 12px; justify-items: start; }

/* ---------- block editor ---------- */
.editor { position: relative; margin-left: calc(-1 * var(--gut)); padding-left: var(--gut); display: flex; flex-direction: column; gap: 1px; font-size: 16px; line-height: 1.75; padding-bottom: 48px; min-height: 120px; }
.blk { position: relative; margin-left: calc(var(--indent, 0) * 26px); min-width: 0; border-radius: 4px; scroll-margin-top: calc(var(--head-h) + 20px); scroll-margin-bottom: 40px; }
.blk.armed { background: var(--accent-soft); }
.blk.dragging { opacity: .35; }
.blk-gutter { position: absolute; left: calc(-1 * var(--gut) + 6px); top: 3px; display: flex; gap: 1px; opacity: 0; transition: opacity .12s; }
.blk:hover > .blk-gutter, .blk.focus > .blk-gutter { opacity: 1; }
.blk-gutter button { width: 22px; height: 26px; border: 0; border-radius: 4px; background: none; color: var(--ink-3); font-size: 17px; line-height: 1; padding: 0; display: grid; place-items: center; }
.blk-gutter .g-handle { font-size: 12px; letter-spacing: -3px; padding-right: 3px; cursor: grab; }
.blk-gutter button:hover { background: var(--bg-2); color: var(--ink-2); }
.blk-h1 > .blk-gutter { top: 30px; }
.blk-h2 > .blk-gutter { top: 22px; }
.blk-h3 > .blk-gutter { top: 14px; }
.blk-divider > .blk-gutter { top: 4px; }
.blk-body { min-width: 0; }
.blk-text { margin: 0; padding: 2px 2px; min-height: 1.75em; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; position: relative; }
[data-ph].is-empty::before { content: attr(data-ph); position: absolute; inset: 0; padding: inherit; color: var(--ink-3); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: inherit; }
.blk-p .blk-text.is-empty:not(:focus)::before { content: none; }
.editor.solo .blk-p .blk-text.is-empty::before { content: attr(data-ph); }
body.ro [data-ph].is-empty::before { content: none !important; }
.hd { display: flex; align-items: center; gap: 2px; }
.hd .blk-text { flex: 1; min-width: 0; }
.blk-h1 .hd { margin-top: 26px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.blk-h2 .hd { margin-top: 18px; }
.blk-h3 .hd { margin-top: 10px; }
.blk-h1 .blk-text { font-family: var(--f-display); font-size: 27px; font-weight: 700; line-height: 1.35; }
.blk-h2 .blk-text { font-family: var(--f-display); font-size: 21px; font-weight: 700; line-height: 1.4; }
.blk-h3 .blk-text { font-size: 17.5px; font-weight: 700; line-height: 1.5; }
.fold { flex: none; width: 24px; height: 28px; margin-left: -4px; border: 0; border-radius: 4px; background: none; color: var(--ink-3); padding: 0; display: grid; place-items: center; }
.fold:hover { color: var(--ink); background: var(--bg-2); }
.fold::before { content: ""; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid currentColor; transform: rotate(90deg); transition: transform .12s; }
.blk.folded .fold::before { transform: none; }
.blk.folded .hd .blk-text { color: var(--ink-2); }
.li { display: flex; align-items: flex-start; }
.li .blk-text { flex: 1; min-width: 0; }
.mk { flex: none; width: 26px; text-align: center; color: var(--ink-2); padding-top: 2px; user-select: none; }
.blk-ol .mk { width: 30px; text-align: right; padding-right: 7px; padding-top: 4px; font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.chk { flex: none; width: 18px; height: 18px; margin: 6px 7px 0 4px; border: 1.5px solid var(--ink-3); border-radius: 4px; background: var(--bg); padding: 0; display: grid; place-items: center; }
.chk[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.chk[aria-checked="true"]::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--accent-ink); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.blk-todo.done .blk-text { color: var(--ink-3); text-decoration: line-through; }
.blk-quote .blk-text { border-left: 3px solid var(--ink); padding-left: 14px; margin: 4px 0; }
.callout { display: flex; gap: 10px; margin: 4px 0; padding: 10px 14px; background: var(--bg-2); border-radius: 8px; }
.callout .ic { flex: none; color: var(--accent); font-weight: 700; padding-top: 2px; user-select: none; }
.callout .blk-text { flex: 1; min-width: 0; }
.blk-code pre.blk-text { margin: 6px 0; padding: 14px 16px; background: var(--code-bg); border-radius: 8px; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.65; white-space: pre; overflow-x: auto; tab-size: 2; word-break: normal; overflow-wrap: normal; }
.blk-divider .blk-body { padding: 13px 0; }
.blk-divider hr { border: 0; border-top: 1px solid var(--rule); margin: 0; }
.editor b, .editor strong { font-weight: 700; }
.editor code { font-family: var(--f-mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.editor mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 2px; }
.editor a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.editor a.plink { color: var(--ink); text-decoration: none; }

.term { margin: 8px 0; padding: 14px 18px 14px; border: 1px solid var(--rule); border-radius: 10px; display: grid; gap: 4px; }
.term-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.term-word { display: inline-block; min-width: 3.5em; font-family: var(--f-display); font-size: 22px; font-weight: 700; line-height: 1.35; position: relative; padding: 0 2px; }
.term-meta { display: inline-block; min-width: 7em; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.8; color: var(--accent); background: var(--accent-soft); padding: 0 10px; border-radius: 999px; position: relative; }
.term-meta.is-empty::before { color: var(--accent); opacity: .6; }
.term-def { position: relative; min-height: 1.75em; padding: 0 2px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }

.tbl-wrap { overflow-x: auto; margin: 8px 0 2px; }
.tbl { border-collapse: collapse; min-width: 100%; font-size: 15px; line-height: 1.6; }
.tbl td, .tbl th { border: 1px solid var(--rule); padding: 7px 10px; min-width: 96px; vertical-align: top; text-align: left; position: relative; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.tbl th { background: var(--bg-2); font-weight: 600; }
.tbl .cell:focus { box-shadow: inset 0 0 0 2px var(--accent); }
.tbl-ctl { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; opacity: 0; transition: opacity .12s; }
.blk-table:hover .tbl-ctl, .blk-table.focus .tbl-ctl { opacity: 1; }

.fig { margin: 8px 0; }
.fig img { display: block; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--rule); }
.fig .cap { position: relative; font-size: 13.5px; color: var(--ink-2); padding: 6px 2px 0; min-height: 1.6em; }
body.ro .fig .cap.is-empty { display: none; }
.img-empty { display: flex; align-items: center; gap: 12px; width: 100%; margin: 6px 0; padding: 16px 18px; border: 1px dashed var(--rule); border-radius: 8px; background: var(--bg-2); color: var(--ink-2); font-size: 14px; text-align: left; line-height: 1.5; }
.img-empty:hover { border-color: var(--accent); color: var(--ink); }
.img-empty small { color: var(--ink-3); }
.img-ic { width: 28px; height: 22px; flex: none; border: 1.5px solid currentColor; border-radius: 4px; position: relative; }
.img-ic::after { content: ""; position: absolute; left: 4px; bottom: 3px; width: 9px; height: 7px; border-left: 1.5px solid currentColor; border-top: 1.5px solid currentColor; transform: rotate(45deg); transform-origin: left bottom; }

.plink { display: inline-flex; align-items: baseline; gap: 8px; max-width: 100%; margin: 1px 0; padding: 3px 8px 3px 4px; border-radius: 6px; color: var(--ink); text-decoration: none; }
.plink:hover { background: var(--bg-2); }
.pg { width: 12px; height: 15px; flex: none; position: relative; top: 2px; border: 1.5px solid var(--ink-2); border-radius: 2px; }
.pg::after { content: ""; position: absolute; left: 2px; right: 2px; top: 3px; height: 5px; border-top: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); }
.plink .n { font-family: var(--f-mono); font-size: 12.5px; color: var(--accent); flex: none; }
.plink .t { font-weight: 500; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; overflow-wrap: anywhere; }
.plink:hover .t { text-decoration-color: currentColor; }
.plink.missing, .plink.missing .t { color: var(--danger); }
.plink-edit { align-items: center; }
.plink-input { min-width: 0; width: min(22em, 70vw); border: 0; border-bottom: 1.5px dashed var(--rule); background: none; color: var(--ink); font: inherit; font-weight: 500; padding: 2px 2px; }
.plink-input:focus { outline: none; border-bottom-color: var(--accent); }
.plink-input::placeholder { color: var(--ink-3); font-weight: 400; }
.plink.missing .pg { border-color: var(--danger); }

.toc-block { display: inline-block; min-width: 240px; max-width: 100%; margin: 8px 0; padding: 10px 16px 12px 12px; border: 1px solid var(--rule); border-radius: 8px; }
.toc-title { margin: 0 0 4px 6px; font-size: 13px; font-weight: 700; }

/* ---------- popovers ---------- */
.pop { position: fixed; z-index: 60; background: var(--pop-bg); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 16px 36px -12px var(--shadow), 0 2px 8px -2px var(--shadow); padding: 6px; font-size: 14px; line-height: 1.5; }
.slash { width: 300px; max-height: min(380px, 60vh); overflow-y: auto; }
.pop-group { font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding: 8px 8px 4px; letter-spacing: .03em; }
.si { display: grid; grid-template-columns: 38px minmax(0, 1fr); align-items: center; gap: 10px; width: 100%; padding: 5px 8px; border: 0; border-radius: 6px; background: none; text-align: left; }
.si.on { background: var(--bg-2); }
.si-ic { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--rule); border-radius: 7px; background: var(--bg); font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.si-tx { display: grid; min-width: 0; }
.si-l { font-size: 14px; font-weight: 500; }
.si-h { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop-empty { padding: 10px; font-size: 13px; color: var(--ink-3); }
.menu { width: 248px; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; border-radius: 6px; background: none; font-size: 14px; text-align: left; }
.menu-item:hover, .menu-item:focus-visible { background: var(--bg-2); outline: none; }
.menu-item.danger { color: var(--danger); }
.menu-sep { height: 1px; background: var(--rule); margin: 4px 2px; }
.menu-chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 6px 8px; }
.chip { border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; font-size: 12.5px; padding: 2px 8px; color: var(--ink-2); }
.chip:hover { color: var(--ink); border-color: var(--ink-3); }
.chip.on { border-color: var(--accent); color: var(--accent); }
.confirm { display: grid; gap: 8px; padding: 8px; }
.confirm p { margin: 0; }
.confirm-t { font-weight: 600; overflow-wrap: anywhere; }
.confirm-d { font-size: 13px; color: var(--ink-2); }
.confirm-row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px; }
.picker { width: 340px; display: grid; gap: 6px; }
.pk-head { font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 4px 6px 0; }
.pk-input { width: 100%; height: 34px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 10px; background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
.pk-input:focus { outline: none; border-color: var(--accent); }
.pk-list { max-height: 300px; overflow-y: auto; }
.pk-item { display: flex; gap: 8px; width: 100%; padding: 6px 10px; border: 0; border-radius: 6px; background: none; text-align: left; font-size: 14px; }
.pk-item.on, .pk-item:hover { background: var(--bg-2); }
.pk-item .n { font-family: var(--f-mono); font-size: 12px; color: var(--accent); padding-top: 2px; flex: none; }
.pk-item .t { overflow-wrap: anywhere; }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; min-width: 300px; max-height: 440px; overflow-y: auto; }
.sr { display: grid; gap: 1px; padding: 8px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
.sr.on, .sr:hover { background: var(--bg-2); }
.sr-t { display: flex; gap: 8px; font-weight: 500; }
.sr-t .n { font-family: var(--f-mono); font-size: 12px; color: var(--accent); padding-top: 2px; flex: none; }
.sr-p { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-s { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr mark { background: var(--mark); color: inherit; border-radius: 2px; }
.help { width: 360px; max-height: min(520px, 75vh); overflow-y: auto; padding: 14px 16px; }
.help h3 { margin: 0 0 8px; font-size: 14px; }
.help dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 12px; margin: 0 0 14px; font-size: 13.5px; align-items: baseline; }
.help dt { white-space: nowrap; }
.help dd { margin: 0; color: var(--ink-2); }
.help p { margin: 0; font-size: 13px; color: var(--ink-3); }
.linkpop { display: flex; align-items: center; gap: 8px; padding: 6px 8px; max-width: min(420px, calc(100vw - 32px)); font-size: 13px; }
.linkpop a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linkpop button { flex: none; border: 0; background: none; color: var(--danger); font-size: 13px; padding: 2px 6px; border-radius: 4px; }
.fmt { position: fixed; z-index: 61; display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--fmt-bg); color: var(--fmt-ink); border-radius: 8px; box-shadow: 0 10px 28px -10px var(--shadow); }
.fmt button { min-width: 30px; height: 30px; padding: 0 8px; border: 0; border-radius: 5px; background: none; color: inherit; font-size: 13.5px; white-space: nowrap; }
.fmt button:hover, .fmt button.on { background: var(--fmt-hi); }
.fmt .sep { width: 1px; height: 18px; background: var(--fmt-hi); margin: 0 2px; }
.fmt-link { display: none; align-items: center; gap: 4px; }
.fmt.linking .fmt-btns { display: none; }
.fmt.linking .fmt-link { display: flex; }
.fmt-btns { display: flex; align-items: center; gap: 2px; }
.fmt-link input { flex: 1; min-width: 0; height: 32px; border: 0; border-radius: 5px; padding: 0 8px; background: var(--fmt-hi); color: inherit; font: inherit; font-size: 13.5px; }
.fmt-link input:focus { outline: none; }
.fmt.linking { width: min(340px, calc(100vw - 16px)); padding: 6px; }
.fmt.linking .fmt-link { display: grid; gap: 4px; width: 100%; }
.fmt-link-row { display: flex; gap: 4px; align-items: center; }
.fmt-results { display: grid; gap: 1px; max-height: 248px; overflow-y: auto; }
.fmt .fmt-item { display: grid; justify-items: start; gap: 0; width: 100%; height: auto; min-height: 34px; padding: 5px 8px; text-align: left; line-height: 1.35; }
.fmt-it { font-size: 13.5px; }
.fmt-ip { font-size: 11.5px; opacity: .65; }
.fmt-empty { padding: 8px; font-size: 12.5px; opacity: .7; }
.editor [data-field] a[href] { color: var(--accent) !important; text-decoration: underline !important; text-decoration-thickness: 1.5px !important; text-underline-offset: 3px; cursor: pointer; }
.editor [data-field] a[href]:hover { text-decoration-thickness: 2px !important; }
.editor [data-field] a.missing { color: var(--danger) !important; text-decoration-style: dashed !important; }
.drop-line { position: fixed; z-index: 40; height: 3px; border-radius: 2px; background: var(--accent); pointer-events: none; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 10px; background: var(--fmt-bg); color: var(--fmt-ink); font-size: 14px; box-shadow: 0 12px 30px -10px var(--shadow); }
.toast-btn { flex: none; border: 0; background: var(--fmt-hi); color: inherit; border-radius: 6px; padding: 3px 10px; font-size: 13px; font-weight: 600; }

/* ---------- responsive ---------- */
@media (max-width: 1040px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .side { margin-bottom: 14px; }
  .side-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 40px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg-2); color: var(--ink-2); font-size: 13.5px; font-weight: 500; }
  .side-toggle .chev { width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translateY(-2px); transition: transform .15s; }
  .side.open .side-toggle .chev { transform: rotate(-135deg); }
  .side-inner { display: none; position: static; max-height: none; margin-top: 8px; padding: 14px; border: 1px solid var(--rule); border-radius: 8px; }
  .side.open .side-inner { display: grid; }
  .home { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .home-side { padding-top: 24px; }
}
@media (max-width: 640px) {
  :root { --gut: 30px; }
  .top { position: relative; top: 0; }
  .band-inner { flex-wrap: wrap; row-gap: 8px; }
  .brand { flex: 1 1 0; }
  .brand-tag, .hb-long { display: none; }
  .sync { min-width: 0; }
  .search { order: 5; flex: 1 1 100%; }
  .help-btn { height: 30px; padding: 0 10px; }
  .wrap { padding-block: 20px 80px; }
  .editor { margin-left: -14px; padding-left: 30px; }
  .blk-gutter { left: -28px; }
  .blk-gutter .g-add { display: none; }
  .help { width: calc(100vw - 32px); }
  .picker, .slash { width: min(320px, calc(100vw - 24px)); }
}
@media (hover: none) {
  .tree-add, .ch-ord, .tbl-ctl { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

</head>
<body>
<header class="top" id="top">
  <div class="band">
    <div class="band-inner">
      <a class="brand" href="#home" title="대문으로"><span class="brand-name" id="brandName">위키</span><span class="brand-tag" id="brandCount"></span></a>
      <div class="search" role="search">
        <span class="search-ic" aria-hidden="true"></span>
        <input id="q" type="search" placeholder="문서 제목·본문 검색" autocomplete="off" aria-label="문서 검색">
        <div class="pop results" id="results" hidden></div>
      </div>
      <button class="help-btn" id="helpBtn" type="button" aria-haspopup="dialog"><span class="hb-long">편집 </span>도움말</button>
      <div class="mode-sw" id="modeSw" role="group" aria-label="보기 모드">
        <button type="button" data-mode="read" aria-pressed="true">읽기</button>
        <button type="button" data-mode="edit" aria-pressed="false">편집</button>
      </div>
      <span class="sync" id="sync" data-s="idle" role="status">불러오는 중</span>
    </div>
  </div>
  <nav class="catnav" aria-label="대분류"><div class="catnav-inner" id="catnav"></div></nav>
</header>

<main class="view" id="view"></main>

<div class="pop slash" id="slash" hidden></div>
<div class="pop menu" id="menu" hidden></div>
<div class="pop picker" id="picker" hidden></div>
<div class="pop help" id="help" hidden role="dialog" aria-label="편집 도움말"></div>
<div class="pop linkpop" id="linkPop" hidden><a id="linkPopOpen" href="#home" target="_blank" rel="noopener noreferrer"></a><button id="linkPopRemove" type="button">링크 제거</button></div>
<div class="fmt" id="fmt" hidden>
  <div class="fmt-btns">
    <button type="button" data-cmd="bold" title="굵게"><b>B</b></button>
    <button type="button" data-cmd="italic" title="기울임"><i>I</i></button>
    <button type="button" data-cmd="underline" title="밑줄"><u>U</u></button>
    <button type="button" data-cmd="strikeThrough" title="취소선"><s>S</s></button>
    <span class="sep"></span>
    <button type="button" data-cmd="code" title="인라인 코드">&lt;/&gt;</button>
    <button type="button" data-cmd="mark" title="형광펜">형광펜</button>
    <button type="button" data-cmd="link" title="링크">링크</button>
  </div>
  <div class="fmt-link">
    <div class="fmt-link-row">
      <input id="fmtLinkInput" type="text" placeholder="연결할 문서 검색 (또는 https:// 주소)" autocomplete="off" aria-label="연결할 문서 검색">
      <button type="button" id="fmtLinkRemove">링크 해제</button>
    </div>
    <div class="fmt-results" id="fmtResults"></div>
  </div>
</div>
<div class="drop-line" id="dropLine" hidden></div>

": "", "id": "bqs37ltsfvj", "type": "p"}, {"html": "특히 아이돌 팬덤 문화는 시대별 매체 환경의 변화와 밀접한 관련이 있다. TV와 인쇄 매체가 중심이었던 시기에는 방송 시청과 팬레터, 오프라인 팬클럽 활동이 주요한 팬 활동이었다. 이후 인터넷과 온라인 커뮤니티의 발달로 팬들 간의 정보 공유가 활발해졌으며, SNS와 동영상 플랫폼의 확산은 콘텐츠의 빠른 유통과 글로벌 팬덤의 형성을 촉진했다. 이처럼 아이돌 팬덤 문화는 매체의 변화에 따라 팬들의 소통 방식과 참여 형태, 소비 방식이 달라지는 과정을 보여 준다.", "id": "bq15rvosfvj", "type": "p"}], "by": "sem6lxwp0ef", "createdAt": 1793164290433, "order": 1, "parent": "c1", "title": "아이돌 팬덤 문화의 개념", "updatedAt": 1793164433895}, "pzn1f3dp2em": {"blocks": [{"html": "", "id": "b5im2ykp2em", "type": "p"}], "by": "sy8ltk8lp2y", "createdAt": 1793165929582, "order": 3, "parent": "pnunsiwv0vd", "title": "뭐더라", "updatedAt": 1793165932328}}}</script>

      for (const b of p.blocks) {
        if (b.type !== 'image' || !b.src) continue;
        const iid = rid('i');
        try { await S.fs.doc('images/' + iid).set({ data: b.src, createdAt: Date.now() }); IMG_CACHE.set(iid, Promise.resolve(b.src)); b.asset = iid; b.src = ''; }

function startDb() {
  let first = true;
  S.db.collection('pages').onSnapshot(snap => {
    if (first && snap.metadata && snap.metadata.fromCache && snap.empty) return; /* wait for the server's answer */
    let curRemoved = false, any = false, needRoute = false;
    for (const ch of snap.docChanges()) {
      const id = ch.doc.id;
      if (!/^[A-Za-z0-9-]{1,64}$/.test(id)) continue;
      any = true;
      if (ch.type === 'removed') {
        S_BASE.delete(id);
        if (S.pages.has(id) && !(timers.has(id) || inflight.has(id))) { S.pages.delete(id); if (id === S.route) curRemoved = true; }
        continue;
      }
      const d = ch.doc.data(); if (!d) continue;
      const local = S.pages.get(id);
      if (local && d.by === SESSION && (Number(d.updatedAt) || 0) <= local.updatedAt) continue;
      const remote = normPage(id, d);
      const prevBase = S_BASE.get(id);
      S_BASE.set(id, remote);
      if (first || !local) { S.pages.set(id, normPage(id, d)); if (id === S.route) needRoute = true; continue; }
      const mounted = ED.page === local;
      if (local.by === SESSION || timers.has(id) || inflight.has(id)) {
        const m = mergeDoc(prevBase, local, remote, mounted ? focusedBlockId() : null, mounted && titleFocused(), S_WRITTEN.get(id), SESSION < remote.by);
        local.title = m.title; local.parent = m.parent; local.order = m.order; local.blocks = m.blocks;
        if (!sameAsRemote(local, remote)) touch(id);
        else if (!timers.has(id) && !inflight.has(id)) { local.updatedAt = remote.updatedAt; local.by = remote.by; }
      } else adoptRemote(local, remote);
      if (mounted) { rebaseHistory(local, prevBase, remote); syncEditor(); }
      else if (id === S.route) needRoute = true;
    }
    if (first) {
      first = false; S.loaded = true;
      if (S.mode === 'firebase') seedFromEmbedded();
      renderRoute(); return;
    }
    if (curRemoved) { toast('보고 있던 문서가 다른 곳에서 삭제되었습니다.'); go('home'); return; }
    if (needRoute) renderRoute(); else if (any) renderChrome();
    setSync();
  }, err => {
    const code = err && err.code;
    if (code === 'revoked' || code === 'not_granted') setReadOnly(true);
    toast('위키 저장소와 연결이 끊어졌습니다. 페이지를 다시 열어 주세요.');
  });
}
function startLocal(inViewer) {
  S.mode = 'local';

  let embedded = null;
  try { const el = document.getElementById('wiki-data'); if (el) embedded = JSON.parse(el.textContent); } catch (e) { embedded = null; }
  if (embedded && typeof embedded.id === 'string' && /^[A-Za-z0-9]{1,40}$/.test(embedded.id)) LS_KEY = 'fandom-term-wiki:v1:' + embedded.id;
  let data = null;
  try { data = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { S.localOk = false; }
  if (!(data && data.pages && typeof data.pages === 'object')) data = embedded;
  if (data && data.pages && typeof data.pages === 'object') {
    for (const id of Object.keys(data.pages)) if (/^[A-Za-z0-9-]{1,64}$/.test(id)) S.pages.set(id, normPage(id, data.pages[id]));

function showRemoteNotice() {

/* ================= pages: create / move / delete ================= */
function makePage(parent) {
  const sib = childrenOf(parent);
  const order = sib.length ? Math.max(...sib.map(p => p.order)) + 1 : 1;
  const p = normPage(rid('p'), { title: '', parent, order });
  p.blocks = [newBlock('p')];
  p.createdAt = p.updatedAt = now(); p.by = SESSION;
  S.pages.set(p.id, p);
  reindex();
  return p;
}
/* Every 하위 문서 shows up as a page link inside its parent's body. Links added automatically get an id

const isBlankPage = q => !q.title.trim() && !childrenOf(q.id).length
  && q.blocks.every(b => b.type === 'p' && !plain(b.html || '').trim());

function removePageQuiet(id) {

}
function ensureChildLinks(p, keepId) {
  if (!p || p.id === 'home' || !S.canWrite) return false;
  const have = new Set(p.blocks.filter(b => b.type === 'pagelink').map(b => b.page));
  let miss = childrenOf(p.id).filter(k => !have.has(k.id));
  const blank = miss.filter(k => k.id !== keepId && isBlankPage(k));
  if (blank.length) { blank.forEach(k => removePageQuiet(k.id)); reindex(); miss = miss.filter(k => blank.indexOf(k) < 0); }

  const links = miss.map(k => newBlock('pagelink', { id: ids.has(('L' + k.id).slice(0, 40)) ? undefined : ('L' + k.id).slice(0, 40), page: k.id }));
  let at = -1;
  p.blocks.forEach((b, i) => { if (b.type === 'pagelink') at = i; });
  if (at < 0) { at = p.blocks.length - 1; while (at >= 0 && p.blocks[at].type === 'p' && !p.blocks[at].html) at--; }

}

  if (!pp.blocks.length) pp.blocks.push(newBlock('p'));

}

  if (!S.canWrite) return;
  const p = makePage(parent);
  persist(p.id);
  const pp = parent && S.pages.get(parent);
  if (!pp) { go(p.id, true); return; } /* a new 대분류 opens itself */
  ensureChildLinks(pp, p.id);
  S.editLink = p.id;
  if (ED.page === pp) { renderBlocks(); note('struct'); renderChrome(); focusChildLink(p.id); }

}

  const i = sib.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= sib.length) return;
  [sib[i], sib[j]] = [sib[j], sib[i]];

}

  const p = S.pages.get(id); if (!p || effParent(p) === parent) return;
  const sib = childrenOf(parent);
  const oldParent = effParent(p);
  p.parent = parent;
  p.order = sib.length ? Math.max(...sib.map(x => x.order)) + 1 : 1;

}
async function deletePage(id) {
  const p = S.pages.get(id); if (!p) return;
  const ids = [id, ...descendants(id)];
  const parent = effParent(p);
  for (const x of ids) { clearTimeout(timers.get(x)); timers.delete(x); S.pages.delete(x); }
  dropLinksTo(parent, id);
  reindex();
  go(parent || 'home');
  toast(ids.length > 1 ? `문서 ${ids.length}개를 삭제했습니다.` : '문서를 삭제했습니다.');

/* ---- folding: the arrow beside a heading hides everything up to the next heading of the same or a higher level.

const FOLD = new Map();
function foldSet() {
  const id = ED.page && ED.page.id; if (!id) return new Set();
  if (!FOLD.has(id)) { let arr = []; try { arr = JSON.parse(localStorage.getItem('wiki-fold:' + id) || '[]'); } catch (e) { arr = []; } FOLD.set(id, new Set(Array.isArray(arr) ? arr : [])); }

function saveFold() { try { localStorage.setItem('wiki-fold:' + ED.page.id, JSON.stringify(Array.from(foldSet()))); } catch (e) { /* per-viewer convenience only */ } }
function applyFolds() {
  if (!ED.el || !ED.page) return;
  const fs = foldSet();
  let hideBelow = 0;
  for (const b of ED.page.blocks) {
    const r = rowEl(b.id); if (!r) continue;
    const lv = /^h[123]$/.test(b.type) ? +b.type[1] : 0;
    if (lv && hideBelow && lv <= hideBelow) hideBelow = 0;
    r.hidden = !!hideBelow;
    if (lv) {
      const folded = fs.has(b.id);
      r.classList.toggle('folded', folded);
      const fb = r.querySelector('.fold'); if (fb) fb.setAttribute('aria-expanded', String(!folded));
      if (folded && !hideBelow) hideBelow = lv;

}
function unfoldTo(id) {
  if (!ED.page) return;
  const fs = foldSet(), stack = [];
  let changed = false;
  for (const b of ED.page.blocks) {
    if (b.id === id) break;
    const lv = /^h[123]$/.test(b.type) ? +b.type[1] : 0;
    if (lv) { while (stack.length && stack[stack.length - 1].lv >= lv) stack.pop(); stack.push({ id: b.id, lv }); }
  }
  for (const s of stack) if (fs.delete(s.id)) changed = true;

    if (b.type === 'p' && !b.indent && prev && prev.type === 'p' && !prev.indent) {

      <dt>제목 왼쪽 <kbd>▾</kbd></dt><dd>그 제목 아래 내용 접기·펼치기</dd>
      <dt><kbd>Tab</kbd></dt><dd>들여쓰기 · <kbd>Shift</kbd>+<kbd>Tab</kbd> 내어쓰기</dd>
      <dt><kbd>${MOD}</kbd>+<kbd>B</kbd> <kbd>I</kbd> <kbd>U</kbd></dt><dd>굵게 · 기울임 · 밑줄</dd>
      <dt><kbd>${MOD}</kbd>+<kbd>E</kbd></dt><dd>인라인 코드</dd>
      <dt><kbd>${MOD}</kbd>+<kbd>K</kbd></dt><dd>선택한 글자를 다른 문서(또는 웹 주소)로 연결. 문서 제목을 쳐서 찾고 Enter</dd>
      <dt><kbd>${MOD}</kbd>+<kbd>Shift</kbd>+<kbd>H</kbd></dt><dd>형광펜</dd>
      <dt><kbd>⋮⋮</kbd></dt><dd>블록 왼쪽 손잡이. 끌어서 옮기고, 누르면 전환·복제·삭제</dd>
    </dl>
    <p>글자를 드래그해 선택하면 서식 도구가 뜹니다.</p>
    <button type="button" class="help-link" id="helpExport">백업용 HTML 파일로 내보내기</button>`;
  $('#helpExport').onclick = () => { pop.hidden = true; exportHtml(); };
  placePop(pop, $('#helpBtn').getBoundingClientRect(), true);
}

/* ================= search ================= */
const textCache = new Map();
function pageText(p) {
  const c = textCache.get(p.id);
  if (c && c.u === p.updatedAt && c.n === p.blocks.length) return c.t;
  const parts = [];
  for (const b of p.blocks) {
    if (b.word) parts.push(plainSp(b.word));
    if (b.meta) parts.push(plainSp(b.meta));
    if (b.html) parts.push(plainSp(b.html));
    if (b.text) parts.push(b.text);
    if (b.caption) parts.push(plainSp(b.caption));
    if (b.rows) parts.push(b.rows.map(r => r.map(plainSp).join(' ')).join(' '));
  }
  const t = parts.join(' ').replace(/\s+/g, ' ');
  textCache.set(p.id, { u: p.updatedAt, n: p.blocks.length, t });
  return t;
}
function hlInto(el, text, q) {
  const tl = text.toLowerCase(), ql = q.toLowerCase();
  let i = 0;
  while (ql && i < text.length) {
    const j = tl.indexOf(ql, i); if (j < 0) break;
    if (j > i) el.append(text.slice(i, j));
    el.append(h('mark', null, text.slice(j, j + ql.length)));
    i = j + ql.length;
  }
  if (i < text.length) el.append(text.slice(i));
}
function initSearch() {
  const inp = $('#q'), box = $('#results');
  let res = [], idx = 0, q = '';
  const draw = () => {
    box.innerHTML = '';
    if (!res.length) box.append(h('div', 'pop-empty', `‘${q}’이(가) 들어간 문서가 없습니다`));
    res.forEach((r, i) => {
      const a = h('a', 'sr' + (i === idx ? ' on' : '')); a.href = '#' + r.id;
      const top = h('span', 'sr-t'); const t = h('span'); hlInto(t, r.t, q);
      top.append(nn(r.id), t); a.append(top);
      const path = ancestors(r.id).map(x => titleOf(S.pages.get(x))).join(' / ');
      if (path) a.append(h('span', 'sr-p', path));
      if (r.snip) { const sn = h('span', 'sr-s'); hlInto(sn, r.snip, q); a.append(sn); }
      a.onclick = () => { box.hidden = true; inp.value = ''; inp.blur(); };
      box.append(a);
    });
    box.hidden = false;
  };
  const run = () => {
    q = inp.value.trim();
    if (!q || !S.loaded) { box.hidden = true; return; }
    const ql = q.toLowerCase();
    res = [];
    for (const id of S.flat) {
      const p = S.pages.get(id), t = titleOf(p), tl = t.toLowerCase();
      let score = tl === ql ? 100 : tl.startsWith(ql) ? 60 : tl.includes(ql) ? 40 : 0;
      const body = pageText(p), bi = body.toLowerCase().indexOf(ql);
      let snip = '';
      if (bi >= 0) { score += 10; const st = Math.max(0, bi - 20); snip = (st ? '…' : '') + body.slice(st, bi + ql.length + 48); }
      if (score) res.push({ id, t, snip, score });
    }
    res.sort((a, b) => b.score - a.score);
    res = res.slice(0, 8); idx = 0;
    draw();
  };
  inp.addEventListener('input', run);
  inp.addEventListener('focus', run);
  inp.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); if (res.length) { idx = (idx + 1) % res.length; draw(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (res.length) { idx = (idx - 1 + res.length) % res.length; draw(); } }
    else if (e.key === 'Enter') { e.preventDefault(); const r = res[idx]; if (r) { box.hidden = true; inp.value = ''; inp.blur(); go(r.id); } }
    else if (e.key === 'Escape') { box.hidden = true; inp.blur(); }
  });
}

/* ================= export to a standalone HTML file ================= */
const FONT_LINKS = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">';
async function assetToDataURL(id) {
  if (S.mode === 'firebase') { const s = await fbImage(id); return /^data:image\/(png|jpe?g|gif|webp);base64,/.test(s) ? s : ''; }
  try {
    const r = await fetch('/_blob/' + id);
    if (!r.ok) throw new Error('fetch');
    const blob = await r.blob();
    if (!/^image\/(png|jpe?g|gif|webp)$/.test(blob.type)) throw new Error('type');
    return await readDataURL(blob);
  } catch (e) {
    try {
      const img = new Image(); img.src = '/_blob/' + id; await img.decode();
      const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      return c.toDataURL('image/png');
    } catch (e2) { return ''; }
  }
}
let exporting = false;
async function exportHtml() {
  if (exporting) return;
  if (!S.loaded) return toast('위키를 다 불러온 뒤에 내보낼 수 있습니다.');
  if (!SELF || !SELF.script) return toast('이 화면에서는 내보낼 수 없습니다.');
  exporting = true;
  try {
    toast('HTML 파일을 만드는 중…');
    const pages = {}, cache = new Map();
    let missing = 0;
    for (const p of S.pages.values()) {
      if (p.id === 'home' && !p.title && !p.updatedAt) continue;
      const d = toDoc(p);
      for (const b of d.blocks) {
        if (b.type !== 'image' || !b.asset) continue;
        if (!cache.has(b.asset)) cache.set(b.asset, await assetToDataURL(b.asset));
        const src = cache.get(b.asset);
        if (src) { b.src = src; b.asset = ''; } else missing++;
      }
      pages[p.id] = d;
    }
    const home = S.pages.get('home');
    const name = (home && home.title.trim()) || '위키';
    const data = { v: 1, id: 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), exportedAt: Date.now(), pages };
    const end = '</' + 'script>';
    const html = '<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
      + '<title>' + esc(name) + '</title>\n' + FONT_LINKS + '\n'
      + '<style id="wiki-style">' + SELF.style + '</style>\n</head>\n<body>\n'
      + SELF.markup + '\n'
      + '<script type="application/json" id="wiki-data">' + JSON.stringify(data).replace(/</g, '\\u003c') + end + '\n'
      + '<script>' + SELF.script.replace(/\/\*FB\*\/[\s\S]*?\/\*FB\*\//, '/*FB*/null/*FB*/') + end + '\n</body>\n</html>\n';
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    const filename = (name.replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60) || 'wiki') + `_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.html`;
    const blob = new Blob([html], { type: 'text/html' });
    const note2 = missing ? ` (이미지 ${missing}개는 담지 못했습니다)` : '';
    const cl = window.claude;
    if (cl && typeof cl.use === 'function') {
      let dl = null;
      try { dl = await cl.use('downloads'); } catch (e) { dl = null; }
      if (!dl) return toast('이 화면에서는 파일 저장을 쓸 수 없습니다.');
      try { await dl.save({ filename, data: blob }); toast('HTML 파일을 저장했습니다' + note2 + '.'); }
      catch (e) { if (!e || e.code !== 'declined') toast('파일을 저장하지 못했습니다. 잠시 뒤 다시 시도해 주세요.'); }
      return;
    }
    /* Opened as a local file: browsers drop the suggested name on plain download links there, so ask where to save when the browser can. */
    if (location.protocol === 'file:' && typeof window.showSaveFilePicker === 'function') {
      try {
        const fh = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description: 'HTML 파일', accept: { 'text/html': ['.html'] } }] });
        const w = await fh.createWritable(); await w.write(blob); await w.close();
        toast('HTML 파일을 저장했습니다' + note2 + '.');
        return;
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('HTML 파일을 내려받았습니다' + note2 + '.');
  } finally { exporting = false; }
}

/* ================= toast ================= */
let toastTimer;
function toast(msg, action) {
  const t = $('#toast'); t.innerHTML = '';
  t.append(h('span', null, msg));
  if (action) { const b = btn('toast-btn', action.label); b.onclick = () => { t.hidden = true; action.fn(); }; t.append(b); }
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, action ? 6000 : 3200);
}

/* ================= global wiring ================= */
function initChrome() {
  const top = $('#top');
  const setHead = () => document.documentElement.style.setProperty('--head-h', top.offsetHeight + 'px');
  setHead();
  if (window.ResizeObserver) new ResizeObserver(setHead).observe(top);

  window.addEventListener('hashchange', () => {
    flushAll();
    S.route = routeFromHash();
    renderRoute();
    window.scrollTo(0, 0);
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
  window.addEventListener('pagehide', flushAll);

  document.addEventListener('mousedown', e => {
    const t = e.target;
    if (!t.closest('#menu') && !t.closest('.g-handle') && !t.closest('#pageMenuBtn')) $('#menu').hidden = true;
    if (!t.closest('#picker')) $('#picker').hidden = true;
    if (!t.closest('#help') && !t.closest('#helpBtn')) $('#help').hidden = true;
    if (slash.open && !t.closest('#slash') && !(slash.el && slash.el.contains(t))) closeSlash();
    if (!t.closest('.search')) $('#results').hidden = true;
    if (S.linkEditing && !t.closest('#fmt')) endLinkEdit();
  });
  /* Ctrl/⌘+Z undoes the latest change on this page (typing, formatting, blocks, images);
     Ctrl/⌘+Shift+Z or Ctrl+Y redoes. The browser's own per-field undo is switched off. */
  document.addEventListener('keydown', e => {
    if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
    const k = (e.key || '').toLowerCase(), code = e.code || '';
    const isZ = code === 'KeyZ' || k === 'z', isY = code === 'KeyY' || k === 'y';
    if (!isZ && !isY) return;
    const a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
    if (!ED.page || !S.canWrite || e.isComposing) return;
    e.preventDefault(); e.stopPropagation();
    if (isY || e.shiftKey) redo(); else undo();
  }, true);
  document.addEventListener('beforeinput', e => {
    if (e.inputType !== 'historyUndo' && e.inputType !== 'historyRedo') return;
    if (!ED.page) return;
    e.preventDefault();
    if (e.inputType === 'historyUndo') undo(); else redo();
  }, true);
  window.addEventListener('dragover', e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    if (!(e.target.closest && e.target.closest('#editor'))) e.dataTransfer.dropEffect = 'none';
  });
  window.addEventListener('drop', e => { if (hasFiles(e)) { e.preventDefault(); $('#dropLine').hidden = true; } });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    $('#menu').hidden = true; $('#help').hidden = true;
    if (S.linkEditing) { endLinkEdit(); restoreLinkRange(); }
  });
  let raf = 0;
  document.addEventListener('selectionchange', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(updateFmt); });
  window.addEventListener('scroll', () => {
    $('#menu').hidden = true; $('#linkPop').hidden = true;
    if (slash.open && slash.el) placePop($('#slash'), caretRect(slash.el));
    if (!$('#fmt').hidden && !S.linkEditing) updateFmt();
  }, { passive: true });
  window.addEventListener('resize', () => { if (slash.open) closeSlash(); $('#menu').hidden = true; $('#help').hidden = true; });

  const fmt = $('#fmt');
  fmt.addEventListener('mousedown', e => { if (e.target.tagName !== 'INPUT') e.preventDefault(); });
  fmt.addEventListener('click', e => {
    const b = e.target.closest('button[data-cmd]'); if (!b) return;
    const c = b.dataset.cmd;
    if (c === 'code' || c === 'mark') toggleWrap(c);
    else if (c === 'link') openLinkEditor();
    else { document.execCommand(c); updateFmt(); }
  });
  $('#fmtLinkRemove').onclick = () => applyLink(true);
  $('#fmtLinkInput').addEventListener('input', () => { linkSel = 0; drawLinkResults(); });
  $('#fmtLinkInput').addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;
    const n = linkItems.length;
    if (e.key === 'ArrowDown') { e.preventDefault(); if (n) { linkSel = (linkSel + 1) % n; drawLinkResults(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (n) { linkSel = (linkSel - 1 + n) % n; drawLinkResults(); } }
    else if (e.key === 'Enter') { e.preventDefault(); applyLinkItem(linkItems[linkSel]); }
    else if (e.key === 'Escape') { e.preventDefault(); endLinkEdit(); restoreLinkRange(); }
  });

  const lp = $('#linkPop');
  lp.addEventListener('mouseenter', () => clearTimeout(linkTimer));
  lp.addEventListener('mouseleave', hideLinkSoon);
  $('#linkPopRemove').onclick = () => {
    const a = S.hoverLink; lp.hidden = true;
    if (!a || !a.isConnected) return;
    const f = fieldOf(a); unwrap(a);
    if (f) f.dispatchEvent(new Event('input', { bubbles: true }));
  };
  $('#helpBtn').onclick = openHelp;
  $('#modeSw').addEventListener('click', e => { const b = e.target.closest('button[data-mode]'); if (b) setEditMode(b.dataset.mode === 'edit'); });
  renderMode();
  initSearch();
}

async function init() {
  initChrome();
  S.route = routeFromHash();
  renderRoute();
  if (FIREBASE_CONFIG && FIREBASE_CONFIG.projectId) {
    try { await startFirebase(); }
    catch (e) { console.error(e); startLocal(false); toast('Firebase에 연결하지 못해, 편집 내용이 이 브라우저에만 저장됩니다. 설정값을 확인해 주세요.'); }
    return;
  }
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') return startLocal(false);
  let db = null;
  try { db = await cl.use('db'); } catch (e) { db = null; }
  if (!db) return startLocal(true);
  S.db = db; S.mode = 'db';
  cl.use('user').then(async u => {
    if (!u) return;
    try { if ((await u.can('data.write')) === false) setReadOnly(true); } catch (e) { /* keep editable; a refused write decides */ }
  }).catch(() => {});
  cl.use('assets').then(a => { S.assets = a || null; }).catch(() => {});
  startDb();
}
init().catch(err => {
  console.error(err);
  $('#view').innerHTML = '<div class="wrap"><div class="state">위키를 여는 중 문제가 생겼습니다. 페이지를 다시 열어 주세요.</div></div>';
});
})();
